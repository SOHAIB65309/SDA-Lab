services:
  - type: web
    name: shopease-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
